{% extends "base.html" %}

{% block title %}MBTI 성격유형 테스트{% endblock %}

{% block content %}
<section class="hero">
    <div class="container">
        <h1>나의 MBTI는 무엇일까?</h1>
        <p class="subtitle">12개의 간단한 질문으로 알아보는 나의 성격유형</p>
        <a href="/quiz/" class="btn btn-primary">테스트 시작하기</a>
        <a href="/types/" class="btn btn-secondary">16유형 살펴보기</a>
    </div>
</section>

<section class="features">
    <div class="container">
        <div class="feature-grid">
            <div class="feature-card">
                <div class="feature-icon">📝</div>
                <h3>간단한 테스트</h3>
                <p>12개의 질문만으로 빠르게 나의 유형을 알아보세요.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🔍</div>
                <h3>상세한 분석</h3>
                <p>각 유형의 특징, 강점, 약점, 추천 직업을 확인하세요.</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌈</div>
                <h3>16가지 유형</h3>
                <p>모든 MBTI 유형의 설명을 한눈에 볼 수 있습니다.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
