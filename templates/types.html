{% extends "base.html" %}

{% block title %}16가지 MBTI 유형{% endblock %}

{% block content %}
<section class="types-section">
    <div class="container">
        <h1>16가지 MBTI 유형</h1>
        <p class="subtitle">각 유형을 클릭하면 상세 설명을 볼 수 있습니다.</p>

        <div class="types-grid">
            {% for code, info in types.items() %}
            <a href="/types/{{ code }}" class="type-card">
                <span class="type-code">{{ code }}</span>
                <span class="type-name">{{ info.name }}</span>
                <span class="type-title">{{ info.title }}</span>
            </a>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
