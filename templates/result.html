{% extends "base.html" %}

{% block title %}결과: {{ mbti_type }}{% endblock %}

{% block content %}
<section class="result-section">

        <div class="result-card">
            <p class="result-label">당신의 MBTI 유형은</p>

            <a href="/quiz/" class="btn btn-secondary">다시 테스트하기</a>
        </div>
    </div>
</section>
{% endblock %}
